version: 2

updates:
  # Workflow actions are pinned to commit SHAs, which never update on their own.
  # Dependabot understands the "<sha> # <version>" form and bumps both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    # One PR for all actions instead of one per action.
    groups:
      actions:
        patterns: ['*']
