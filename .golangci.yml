version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    - misspell
  settings:
    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: true
    staticcheck:
      # Disable the "prefer fmt.Fprintf over WriteString(fmt.Sprintf)" quickfix.
      # The WriteString+Sprintf pattern reads naturally for complex formatted
      # output and the micro-performance gain of Fprintf is irrelevant for TUI.
      checks: ["all", "-QF1012"]
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofumpt
    - goimports
